name: promotion-chain

# Enforces the branch promotion chain: dev -> qa -> stage -> prod (main mirrors prod).
# This can only reject pull requests; it CANNOT block direct pushes to qa/stage/prod.
# Branch protection is unavailable (free plan + private repo), so CI is the only guard.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [qa, stage, prod, main]

jobs:
  check-promotion-source:
    name: PR source matches promotion chain
    runs-on: ubuntu-latest
    steps:
      - name: Assert head branch is the valid predecessor of the base branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "$BASE" in
            qa)    valid="dev" ;;
            stage) valid="qa" ;;
            prod)  valid="stage" ;;
            main)  valid="prod" ;;
            *)
              # Unreachable given the trigger filter, but fail loudly if it happens.
              echo "::error::Unexpected PR base branch '$BASE'; this workflow only guards qa, stage, prod, and main."
              exit 1
              ;;
          esac

          if [ "$HEAD" = "$valid" ]; then
            echo "OK: PR into '$BASE' comes from '$valid'."
          else
            echo "::error::PR into '$BASE' must come from '$valid', not '$HEAD'. Promote through the chain: dev -> qa -> stage -> prod (main mirrors prod)."
            exit 1
          fi
